name: "Bygg app (pnpm)"

# ------------------------------------------------------------
# Denne workflowen bygger en TypeScript-applikasjon som bruker pnpm.
#
# Forutsetninger: Repoet som kaller denne jobben må ha definert to scripts:
#  - build: Bygger prod-versjon av appen
# ------------------------------------------------------------

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node-versjon'
        type: string
        required: false
        default: '24'

jobs:
  build:
    name: Bygg app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_//npm.pkg.github.com/:_authToken: ${{ secrets.READER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v2.0.2
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile
      - name: Bygg app
        run: pnpm run build
