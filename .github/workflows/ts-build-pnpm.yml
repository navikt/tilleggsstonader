name: "Bygg app (pnpm)"

# ------------------------------------------------------------
# Denne workflowen bygger en TypeScript-applikasjon som bruker pnpm.
#
# Forutsetninger: Repoet som kaller denne jobben må ha definert to scripts:
#  - build: Bygger prod-versjon av appen
# ------------------------------------------------------------

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node-versjon'
        type: string
        required: false
        default: '24'

jobs:
  build:
    name: Bygg app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ inputs.node-version }}
          cache: true
          install: false
      - name: Konfigurer GitHub Packages auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$READER_TOKEN"
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile
      - name: Bygg app
        run: pnpm run build
