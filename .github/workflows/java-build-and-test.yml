name: Bygg app og kjør tester

on:
  workflow_call:
    inputs: { }

jobs:
  build:
    name: Bygg, lint og kjør tester
    runs-on: ubuntu-latest
    concurrency: ${{ github.workflow }}-${{ github.ref }}
    timeout-minutes: 10

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # brukes for å unngå feil i differ i sonar

      - name: Sett opp JDK25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Sett opp Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Kjør ktlint
        run: ./gradlew spotlessCheck

      - name: Bygg og kjør tester
        run: ./gradlew build -PskipLint
